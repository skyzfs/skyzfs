# k3s smoke (CSI design 6g): writable clone from a snapshot. The RW PVC
# with a VolumeSnapshot dataSource provisions a server fast clone — a
# real volume starting at the snapshot's content that diverges
# independently of the source.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-clone-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: skynbd
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: smoke-snap
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-cloner
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: smoke-clone-pvc
