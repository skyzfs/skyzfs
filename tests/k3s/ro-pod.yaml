# k3s smoke (CSI design 6e): read-only snapshot mount. The RO PVC becomes
# a reference volume onto the snapshot's existing RO export — no new
# server volume — and the pod must see the pre-snapshot content.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-ro-pvc
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: skynbd
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: smoke-snap
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-reader
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: smoke-ro-pvc
        readOnly: true
