# Second consumer of uds-pvc: proves unstage (nbd-client -d over the
# socket) and a fresh restage return the same content.
apiVersion: v1
kind: Pod
metadata:
  name: uds-reader
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: uds-pvc
