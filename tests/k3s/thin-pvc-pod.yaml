# k3s smoke (CSI design 6h): thin-mode volume — the node stages it as
# fs → shim → thin origin → local thin pool (publish-only, origin-advance §5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-thin-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: skynbd-thin
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-thin-writer
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: smoke-thin-pvc
