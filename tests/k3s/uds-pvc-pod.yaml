# k3s UDS smoke workload (CSI design §2.1): provision through the
# skynbd StorageClass and do real IO over the node-local Unix data path.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uds-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: skynbd
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: uds-writer
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: uds-pvc
