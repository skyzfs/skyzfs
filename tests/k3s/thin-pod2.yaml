# k3s smoke (CSI design 6h): second consumer of the thin PVC — proves
# the unstage flush + teardown left a re-buildable stack (the cache file
# carries the thin metadata through restage).
apiVersion: v1
kind: Pod
metadata:
  name: smoke-thin-reader
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: smoke-thin-pvc
