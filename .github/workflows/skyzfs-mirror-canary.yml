name: skyzfs-mirror-canary

# The only way to try tests/lib/apt-fallback.sh for real, and to see
# what a runner image's mirror list and sources look like. By dispatch
# only. It shows the list and the sources, says which names resolve,
# runs the script, then runs apt-get update and installs what the
# project's workflows install, and reports where each package came
# from and how long each step took. It judges nothing of the product.
#
# With the input `force`, the script is told that the image's mirrors
# do not resolve, so the fallback can be tried on a healthy day.
#
# The job is red when a group the workflows need did not install. Two
# groups can fail for reasons that are not the mirror's, and are then
# reported in the table and not counted, each by a stated rule:
#   linux-modules-extra-<kernel>: when apt knows no package of that
#     name (the azure kernels have none; the modules are in the image).
#   zfs-dkms: when the running kernel is newer than the newest the
#     packaged ZFS source says it supports (Linux-Maximum in its META).
# A failure of either group for any other reason counts.

on:
  workflow_dispatch:
    inputs:
      force:
        description: tell the script that the image's mirrors do not resolve
        type: boolean
        default: false
      mirror:
        description: another fallback to try, a URL ending in /ubuntu/ or /ubuntu-ports/ (empty for the script's own)
        default: ''
      images:
        description: "runner images, a JSON list: amd64 ubuntu-24.04 ubuntu-26.04, arm64 ubuntu-24.04-arm ubuntu-26.04-arm"
        default: '["ubuntu-24.04","ubuntu-26.04"]'

permissions:
  contents: read

jobs:
  canary:
    name: ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images || '["ubuntu-24.04","ubuntu-26.04"]') }}
    env:
      MIRROR: ${{ inputs.mirror }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v6
      - name: The image's mirrors and sources
        run: |
          set +e
          [[ -z $MIRROR || $MIRROR =~ ^https://[A-Za-z0-9.-]+/[A-Za-z0-9./-]*$ ]] || { echo "::error::not a mirror URL: $MIRROR"; exit 64; }
          [ -z "$MIRROR" ] || echo "APT_FALLBACK_MIRROR=$MIRROR" >> "$GITHUB_ENV"
          echo "== /etc/apt/apt-mirrors.txt"; cat -A /etc/apt/apt-mirrors.txt || true
          echo "== sources"
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            echo "-- $f"; grep -v '^\s*#' "$f" | grep -v '^\s*$' || true
          done
          echo "== apt configuration that names a mirror, a retry or a timeout"
          apt-config dump | grep -i -E 'mirror|retries|timeout|AllowInsecure|AllowUnauth' || true
          echo "== which names resolve"
          {
            echo "### Names, at $(date -u +%H:%M:%S) UTC"
            echo
            echo "| name | resolves |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # An image with no mirror list (ubuntu-24.04-arm) names its hosts in its sources.
          if [ -e /etc/apt/apt-mirrors.txt ]; then
            hosts=$(grep -o '://[^/]*' /etc/apt/apt-mirrors.txt | sed 's|://||' | sort -u)
          else
            hosts=$(cat /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | grep -v '^\s*#' | grep -o 'https\?://[^/ ]*' | sed 's|.*://||' | sort -u)
          fi
          for h in $hosts mirrors.edge.kernel.org github.com; do
            a=$(timeout 25 getent hosts "$h" | head -n 1)
            if [ -n "$a" ]; then r="yes (${a%% *})"; else r="NO"; fi
            echo "$h: $r"
            echo "| $h | $r |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: The script
        run: |
          if [ "$FORCE" = true ]; then
            # A lookup that fails for the names under ubuntu.com.
            printf '#!/bin/sh\ncase $1 in *ubuntu.com) exit 1 ;; esac\ngetent hosts "$1" > /dev/null\n' > "$RUNNER_TEMP/lookup"
            chmod +x "$RUNNER_TEMP/lookup"
            export APT_FALLBACK_LOOKUP=$RUNNER_TEMP/lookup
            echo "Forced: the script is told that the names under ubuntu.com do not resolve." >> "$GITHUB_STEP_SUMMARY"
          fi
          t0=$(date +%s)
          bash tests/lib/apt-fallback.sh
          echo "The script took $(( $(date +%s) - t0 )) s." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -e /etc/apt/apt-mirrors.txt ]; then
            echo "The image has no mirror list; its sources are as they were." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "== the list now"; cat -A /etc/apt/apt-mirrors.txt
          if cmp -s /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors.txt.image 2>/dev/null || [ ! -e /etc/apt/apt-mirrors.txt.image ]; then
            echo "The list is the image's own." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The list holds: $(tr '\t\n' '  ' < /etc/apt/apt-mirrors.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: apt-get update
        id: update
        run: |
          t0=$(date +%s)
          set +e
          sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/update.log"
          rc=${PIPESTATUS[0]}
          t=$(( $(date +%s) - t0 ))
          warn=$(grep -c -E '^(W|E|Err):?' "$RUNNER_TEMP/update.log" || true)
          {
            echo
            echo "### apt-get update : exit $rc in $t s, $warn warning or error lines"
            echo
            echo '```'
            grep -E '^(W|E|Err)' "$RUNNER_TEMP/update.log" | head -n 30 || true
            echo "-- hosts answered from:"
            grep -E '^(Get|Hit):' "$RUNNER_TEMP/update.log" | awk '{ print $2 }' | sort | uniq -c
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Install what the project's workflows install
        if: always()
        run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive
          fails=0
          {
            echo
            echo "### Installs "
            echo
            echo "| group | exit | counted | seconds | packages fetched, by host | first error |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          group() { # NAME PACKAGE...
            local name=$1 t0 rc from err why counted=yes; shift
            t0=$(date +%s)
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$@" > "$RUNNER_TEMP/install-$name.log" 2>&1; rc=$?
            from=$(grep '^Get:' "$RUNNER_TEMP/install-$name.log" | awk '{ print $2 }' | sort | uniq -c | awk '{ printf "%s x %s; ", $1, $2 }')
            err=$(grep -m 1 -E '^(E|Err)[: ]|Temporary failure' "$RUNNER_TEMP/install-$name.log" | tr '|' '/')
            if [ $rc != 0 ] && why=$(expected_here "$name"); then counted="no: $why"; fi
            echo "| $name | $rc | $counted | $(( $(date +%s) - t0 )) | ${from:-nothing fetched} | ${err:-none} |" >> "$GITHUB_STEP_SUMMARY"
            echo "== $name: exit $rc${why:+ (expected here, not counted: $why)}"; tail -n 15 "$RUNNER_TEMP/install-$name.log"
            [ $rc = 0 ] || [ "$counted" != yes ] || fails=$((fails + 1))
          }
          # expected_here GROUP: succeeds, and prints why, when the rule
          # in this file's header says that group's failure is not counted.
          expected_here() {
            local max kver
            case $1 in
              modules-extra)
                apt-cache show "linux-modules-extra-$(uname -r)" > /dev/null 2>&1 && return 1
                echo "apt knows no package linux-modules-extra-$(uname -r)" ;;
              dkms)
                max=$(sed -n 's/^Linux-Maximum: *//p' /usr/src/zfs-*/META 2>/dev/null | head -n 1)
                kver=$(uname -r | sed 's/^\([0-9]*\.[0-9]*\).*/\1/')
                [ -n "$max" ] && [ "$max" != "$kver" ] && [ "$(printf '%s\n%s\n' "$max" "$kver" | sort -V | tail -n 1)" = "$kver" ] || return 1
                echo "kernel $kver is newer than Linux-Maximum $max of the packaged ZFS source" ;;
              *) return 1 ;;
            esac
          }
          group build libdevmapper-dev libudev-dev libclang-dev build-essential liburing-dev linux-libc-dev \
            git ca-certificates autoconf automake libtool pkg-config libelf-dev python3-setuptools
          group zfs zfsutils-linux dmsetup python3-numpy
          group zfs-test zfs-test
          group modules-extra "linux-modules-extra-$(uname -r)"
          group e2e qemu-utils libnbd-bin nbd-client lvm2 thin-provisioning-tools fio psmisc lsof iproute2 blktrace
          group bench bcache-tools postgresql postgresql-contrib python3 e2fsprogs
          group dkms "linux-headers-$(uname -r)" zfs-dkms
          echo "== where the installed packages come from by apt's own account"
          apt-cache policy zfsutils-linux libclang-dev liburing-dev | grep -E '^[a-z]|\*\*\*|^ +[0-9]+ http' | head -n 40
          [ "$fails" = 0 ] || { echo "::error::$fails groups did not install"; exit 1; }
      - name: Does ZFS load
        if: always()
        run: |
          sudo modprobe zfs && r="loads: $(cat /sys/module/zfs/version)" || r="does NOT load"
          echo "zfs module $r"
          { echo; echo "ZFS module after the installs: $r. Kernel $(uname -r)."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mirror-canary-${{ matrix.image }}
          path: ${{ runner.temp }}/*.log
          retention-days: 14
