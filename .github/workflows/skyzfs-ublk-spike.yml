name: skyzfs-ublk-spike

# Temporary, for work package M1.3b: the kernel rig of the daemon
# (tests/kernel/daemon-rig.sh) pointed at `skyzfsd` itself and not at
# the stand-in. It is how the binding (crates/skyzfs-ublk-sys) gets its
# first runs against a kernel. It goes before M1.3b's pull request: the
# proper way is an input of skyzfs-daemon-rig.yml, which is the testing
# session's.
#
# The daemon runs with its safeguards on: no `--unsafe-allow-*` in
# RIG_SERVE_ARGS.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: "which checks: a parameters, b kill under load, c the conformance suite, d a failed volume, e a held request"
        default: "a b c d"
      kills:
        description: "kill -9 of the server under load, how many times"
        default: "20"
      hold_s:
        description: "seconds one request is held"
        default: "300"
      red:
        description: "true: run only the stop test against two builds that must FAIL it (the buffers freed at a stop; the last commits of a stop not handed over)"
        default: "false"

concurrency:
  group: daemon-first-run-${{ github.ref }}
  cancel-in-progress: true

# The job runs branch code and third-party code as root: its token can
# read the repository and nothing else.
permissions:
  contents: read

jobs:
  rig:
    name: ${{ matrix.image }}
    if: ${{ inputs.red != 'true' }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-26.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      # While the names of the image's package mirrors do not resolve,
      # use a mirror outside ubuntu.com (tests/lib/apt-fallback.sh).
      - name: Package mirrors
        run: bash tests/lib/apt-fallback.sh
      - name: The binding's kernel tests
        # A limit on the step, and the output streamed: a test that
        # hangs fails the job after ten minutes with its lines printed.
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev libclang-dev
          rustup update stable
          sudo modprobe ublk_drv
          bin=$(cargo test --release --locked -p skyzfs-ublk-sys --features control-test-program --test kernel --no-run 2>&1 | sed -n 's/.*Executable tests\/kernel.rs (\(.*\))/\1/p')
          [ -x "$bin" ] || { echo "::error::no test binary"; exit 1; }
          rc=0
          set +o pipefail
          sudo "$bin" --ignored --test-threads 1 --nocapture 2>&1 | tee kernel-tests.log
          rc=${PIPESTATUS[0]}
          set -o pipefail
          {
            echo "### the binding's kernel tests on ${{ matrix.image }} (exit $rc)"
            echo '```'
            grep -E '^control_|^test |panicked' kernel-tests.log || cat kernel-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sudo ls -la /run/ublksrvd 2>&1 || true
          # The step's colour follows the tests.
          [ "$rc" -eq 0 ] || { echo "::error::the kernel tests ended with $rc"; exit 1; }
      - name: Rig, on the daemon
        if: ${{ !cancelled() }}
        # The settings go in a file: ubuntu-26.04's sudo-rs does not
        # carry the environment through.
        env:
          CHECKS: ${{ inputs.checks || 'a b c d' }}
          KILLS: ${{ inputs.kills || '20' }}
          HOLD_S: ${{ inputs.hold_s || '300' }}
        run: |
          [[ $CHECKS =~ ^[abcde](\ [abcde])*$ ]] || { echo "::error::checks are letters of a b c d e with a space between: '$CHECKS'"; exit 64; }
          for v in "$KILLS" "$HOLD_S"; do
            [[ $v =~ ^[0-9]+$ ]] || { echo "::error::not a number: $v"; exit 64; }
          done
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev libclang-dev
          rustup update stable
          cargo build --release --locked -p skyzfsd --features test-hooks
          if [[ $CHECKS == *c* ]]; then
            cargo build --release --locked -p skyzfs-blkcheck
          fi
          {
            printf 'export RIG_BLKCHECK=%q\n' "$PWD/target/release/skyzfs-blkcheck"
            printf 'export RIG_CHECKS=%q\n' "$CHECKS"
            echo "export RIG_KILLS=$KILLS RIG_HOLD_S=$HOLD_S"
            printf 'export RIG_SKYZFSD=%q\n' "$PWD/target/release/skyzfsd"
          } > "$RUNNER_TEMP/rig.env"
          echo "CHECKS=$CHECKS" >> "$GITHUB_ENV"
          sudo bash -c '. "$1" && exec tests/kernel/daemon-rig.sh "$2" /mnt/skz-daemon-rig' \
            rig "$RUNNER_TEMP/rig.env" "$PWD/rig-out"
      - name: A checkpoint step on a kernel, by the daemon's default marks (M1.3c)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        # Not the rig's and judged by nobody but the reader: a pool on
        # the daemon's device, a write load of several times the high
        # mark, the daemon's status, a scrub, an orderly stop, a second
        # start, and the content again.
        run: |
          cargo build --release --locked -p skyzfsd --features test-hooks
          cat > "$RUNNER_TEMP/ckpt.sh" <<'SCRIPT'
          set -u
          d=$1; base=/mnt/skz-ckpt; pool=skzckpt
          rm -rf "$base"; mkdir -p "$base/run"
          say() { echo "ckpt_$*"; }
          fail() { say "verdict FAIL: $*"; exit 1; }
          status() { say "status_$1 $("$d" status --dir "$base/vol" --run-dir "$base/run" 2>&1 | tr '\n' ';')"; }
          field() { "$d" status --dir "$base/vol" --run-dir "$base/run" 2>/dev/null | tr ';' '\n' | sed -n "s/^ *$1 \([0-9]*\).*/\1/p" | head -n 1; }
          serve() {
            : > "$base/ready"
            "$d" serve --dir "$base/vol" --run-dir "$base/run" > "$base/ready" 2>> "$base/serve.log" &
            pid=$!
            dev=
            for _ in $(seq 150); do
              dev=$(sed -n 's/^ready \(\/dev\/ublkb[0-9]*\)$/\1/p' "$base/ready" | head -n 1)
              [ -n "$dev" ] && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.2
            done
            [ -n "$dev" ] || { cat "$base/serve.log"; fail "serve did not become ready"; }
            say "ready $dev pid $pid"
          }
          stop() {
            kill -TERM "$pid"; wait "$pid"; say "stop_exit $?"
            tail -n 3 "$base/serve.log" | sed 's/^/ckpt_serve_log /'
          }
          say "create $("$d" create --dir "$base/vol" --size $((4 << 30)) --run-dir "$base/run" 2>&1 | tr '\n' ';')"
          serve
          status at_start
          timeout 180 zpool create -f -o ashift=12 -o cachefile=none -O compression=off -O mountpoint="$base/mnt" "$pool" "$dev" || fail "zpool create"
          # 640 MiB that do not compress: five times the high mark of
          # two 64 MiB segments.
          for i in 1 2 3 4 5; do
            dd if=/dev/urandom of="$base/mnt/f$i" bs=1M count=128 conv=fsync status=none || fail "dd $i"
            status "after_${i}x128MiB"
          done
          timeout 120 zpool sync "$pool" || fail "zpool sync"
          sleep 3
          status after_load
          steps=$(field checkpoint_steps); live=$(field log_live)
          say "steps_after_load ${steps:-none} log_live ${live:-none}"
          sums=$(cd "$base/mnt" && sha256sum f1 f2 f3 f4 f5 | sha256sum | cut -d' ' -f1)
          timeout 600 zpool scrub -w "$pool" || fail "scrub"
          say "zpool_after_scrub $(zpool status "$pool" | grep -E 'state:|scan:|errors:|ublkb' | tr -s ' ' | tr '\n' ';')"
          status after_scrub
          timeout 120 zpool export "$pool" || fail "export"
          status before_stop
          stop
          serve
          status second_start
          timeout 180 zpool import -d "$dev" -o cachefile=none "$pool" || fail "import after the restart"
          again=$(cd "$base/mnt" && sha256sum f1 f2 f3 f4 f5 | sha256sum | cut -d' ' -f1)
          timeout 600 zpool scrub -w "$pool" || fail "second scrub"
          health=$(zpool status "$pool" | grep -E 'state:|scan:|errors:|ublkb' | tr -s ' ' | tr '\n' ';')
          say "zpool_after_restart $health"
          say "content before $sums after the restart $again"
          status at_end
          timeout 120 zpool export "$pool" || fail "second export"
          stop
          say "detach $("$d" detach --dir "$base/vol" --run-dir "$base/run" 2>&1 | tr '\n' ';')"
          [ "${steps:-0}" -gt 0 ] || fail "checkpoint_steps was ${steps:-none} after the load"
          [ "$sums" = "$again" ] || fail "the content differs after the restart"
          case $health in *"state: ONLINE"*"errors: No known data errors"*) ;; *) fail "the pool is not healthy: $health" ;; esac
          say "verdict PASS: $steps steps, pool healthy, content the same after a restart"
          SCRIPT
          rc=0
          set +o pipefail
          sudo bash "$RUNNER_TEMP/ckpt.sh" "$PWD/target/release/skyzfsd" 2>&1 | tee ckpt.log
          rc=${PIPESTATUS[0]}
          set -o pipefail
          {
            echo "### a checkpoint step on ${{ matrix.image }} (exit $rc)"
            echo '```'
            grep '^ckpt_' ckpt.log || cat ckpt.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p rig-out && cp ckpt.log rig-out/ 2>/dev/null || true
          [ "$rc" -eq 0 ] || { echo "::error::the checkpoint step's check ended with $rc"; exit 1; }
      - name: What is under /run/ublksrvd and the daemon's run directory
        if: always()
        run: |
          {
            echo "### after the rig on ${{ matrix.image }}"
            echo '```'
            sudo ls -la /run/ublksrvd 2>&1 || true
            sudo find /run/skyzfsd -maxdepth 2 2>&1 | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Judge against the table
        if: always()
        run: |
          sudo chmod -R a+rX rig-out 2>/dev/null || true
          rc=0
          python3 tests/kernel/daemon_check.py rig-out --checks "${CHECKS:-a b c d}" > summary.md || rc=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cp summary.md rig-out/ 2>/dev/null || true
          case $rc in
            0) ;;
            1) echo "::error title=daemon rig::results differ from the table EXPECTED"; exit 1 ;;
            *) echo "::error title=daemon rig::the rig itself failed; this is not a verdict on the server"; exit 2 ;;
          esac
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: daemon-first-run-${{ matrix.image }}
          path: rig-out/
          retention-days: 30


  # The stop test against two builds with a defect put back. Each must
  # FAIL the test: the job is green when the test fails with the words
  # of the assertion the defect is for, and red when the test passes.
  red:
    name: red ${{ matrix.variant }}
    if: ${{ inputs.red == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [buffers-freed, no-flush]
    steps:
      - uses: actions/checkout@v6
      # While the names of the image's package mirrors do not resolve,
      # use a mirror outside ubuntu.com (tests/lib/apt-fallback.sh).
      - name: Package mirrors
        run: bash tests/lib/apt-fallback.sh
      - name: Put the defect back
        run: |
          python3 - "${{ matrix.variant }}" <<'PY'
          import re, sys
          variant = sys.argv[1]
          if variant == "buffers-freed":
              # The buffers are freed when the queue is dropped, as
              # before the review: no Drop that forgets them.
              path = "crates/skyzfs-ublk-sys/src/queue.rs"
              text = open(path).read()
              new, n = re.subn(r"impl Drop for Buffers \{.*?\n\}\n\n", "", text, count=1, flags=re.S)
              assert n == 1, "the Drop of Buffers was not found"
          else:
              # The test's server does not hand its last commits over
              # at a stop.
              path = "crates/skyzfs-ublk-sys/tests/kernel.rs"
              text = open(path).read()
              new, n = re.subn(r"\n *let _ = queue\.flush\(\);", "", text)
              assert n >= 1, "no flush was found"
          open(path, "w").write(new)
          print(f"{variant}: {n} place(s) changed in {path}")
          PY
          git diff --stat
      - name: The stop test, which must fail
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev libclang-dev
          rustup update stable
          sudo modprobe ublk_drv
          # The unit test with no kernel: red with the buffers freed,
          # green with the other defect.
          unit=0
          cargo test --release -p skyzfs-ublk-sys --lib the_buffers_are_never_given_back_to_the_allocator > unit.log 2>&1 || unit=$?
          {
            echo "### the unit test of the buffers with ${{ matrix.variant }} (exit $unit)"
            echo '```'
            grep -E '^test |panicked|left:|right:|went back' unit.log || tail -20 unit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat unit.log
          if [ "${{ matrix.variant }}" = buffers-freed ] && [ "$unit" -eq 0 ]; then
            echo "verdict: FINDING: the unit test PASSED with the buffers freed" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=buffers-freed::the unit test passed with the buffers freed"
            exit 1
          fi
          if [ "${{ matrix.variant }}" != buffers-freed ] && [ "$unit" -ne 0 ]; then
            echo "::error title=${{ matrix.variant }}::the unit test of the buffers failed without that defect"
            exit 2
          fi
          bin=$(cargo test --release -p skyzfs-ublk-sys --features control-test-program --test kernel --no-run 2>&1 | sed -n 's/.*Executable tests\/kernel.rs (\(.*\))/\1/p')
          [ -x "$bin" ] || { echo "::error::no test binary"; exit 2; }
          rc=0
          # With a limit, and streamed: a test that hangs with the
          # defect is killed (exit 137) and has printed its stops.
          set +o pipefail
          sudo timeout -s KILL 180 "$bin" --ignored --test-threads 1 --nocapture --exact a_stop_under_writers_leaves_the_memory_taken_afterwards_alone 2>&1 | tee red.log
          rc=${PIPESTATUS[0]}
          set -o pipefail
          if [ "$rc" -eq 137 ]; then
            echo "::warning title=${{ matrix.variant }}::the test did not end within 180 s and was killed"
            sudo dmesg | tail -40 || true
          fi
          {
            echo "### the stop test with ${{ matrix.variant }} (exit $rc)"
            echo '```'
            grep -E '^control_|^test |panicked' red.log || cat red.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "verdict: FINDING: the stop test PASSED with the defect put back; its detail line is above" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=${{ matrix.variant }}::the stop test PASSED with the defect put back: it does not catch it"
            exit 1
          fi
          # Green with any FAIL line of the test, whatever its reason
          # (changed bytes, a wrong read-back, a writer's error, more
          # handed than finished): the line is quoted. A process that
          # died without one also shows the defect; the job stays red
          # (exit 3) so that the report names which it was.
          line=$(grep -m1 '^control_stop_under_writers_leaves_later_memory_alone.FAIL' red.log || true)
          if [ -z "$line" ]; then
            echo "verdict: the test process died without a FAIL line (exit $rc): the defect shows, not by an assertion" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=${{ matrix.variant }}::the test died without its FAIL line (exit $rc)"
            exit 3
          fi
          echo "verdict: the defect is caught: $line" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=${{ matrix.variant }}::$line"
