name: skyzfs-zfs-cli-record

# Recorded outputs of the ZFS commands the agent's ZFS adapter runs, for
# its fixtures (the M2.6 plan's Q10): zpool status and get, the holds,
# the three `zfs program` scripts, zfs get and zfs list of what the
# manifest reads, on a pool on a ublk device with a log,
# a mirror of files, and a pool that does not exist. Records only: the
# job is green unless the script could not set up. All the logic is
# tests/kernel/zfs-cli-record.sh; the artifact is a tarball of its
# records. Dispatch only.
on:
  workflow_dispatch:
    inputs:
      lua_ref:
        description: "a full commit id or a branch whose crates/skyzfs-agent/src/zfs/cli/*.lua are run, resolved once for every image. Empty: 0f709ae (#147)"
        default: ""
      images:
        description: "a JSON list: amd64 ubuntu-26.04 ubuntu-24.04, arm64 ubuntu-26.04-arm ubuntu-24.04-arm"
        default: '["ubuntu-26.04","ubuntu-24.04"]'
      scale:
        description: "counts of file systems, space-separated (e.g. '1000 10000'), at most three, each at most 100000: the snapshot program, the holds, destroy -r, zfs snapshot -r and the manifest's reads after it (the members program, zfs get of the local properties, zfs list, the full members program) on a pool with that many, timed, with, beside each take and each read, an O_DSYNC writer's longest stall, a writer of new data past the dirty data limit, and the pool's transaction groups and timed zpool sync runs (beside the full read at 1000 only); no count's step starts after 80 minutes in all, and steps that are not counts' commands can run some minutes past them. Empty: none"
        default: ""
      scale_lua_max:
        description: "the largest scale count at which the snapshot program runs (above it, zfs snapshot -r takes @t). Empty: every count"
        default: ""
      scale_full_max:
        description: "the largest scale count at which the full members program runs (it took 912 s at 10000 in run 45720225770). Empty: every count"
        default: ""
  # A dispatch from a branch needs the workflow to have run once: a push
  # runs the unit tests only, and records nothing (the record job is
  # dispatch only). ci.yml runs the unit tests on a pull request.
  push:
    branches: ['skyzfs-testing*']
    paths:
      - tests/kernel/zfs-cli-record.sh
      - tests/kernel/test_zfs_cli_record.sh
      - tests/kernel/dsync_writer.py
      - tests/kernel/test_dsync_writer.py
      - tests/kernel/txg_probe.py
      - tests/kernel/test_txg_probe.py
      - tests/kernel/zfs_cli_json.py
      - tests/kernel/test_zfs_cli_json.py
      - .github/workflows/skyzfs-zfs-cli-record.yml

concurrency:
  group: zfs-cli-record-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash tests/kernel/test_zfs_cli_record.sh
      - run: python3 tests/kernel/test_dsync_writer.py
      - run: python3 tests/kernel/test_txg_probe.py
      - run: python3 tests/kernel/test_zfs_cli_json.py

  # The Lua's commit, resolved once, so that every image runs the same.
  lua:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: resolve
        env:
          LUA_REF: ${{ inputs.lua_ref || '0f709ae015eae55b116ec9cc3bb9ffe340973d0c' }}
        run: |
          case $LUA_REF in
            -*|*[!A-Za-z0-9._/-]*|'') echo "::error::lua_ref is a full commit id or a branch: $LUA_REF"; exit 64 ;;
          esac
          git fetch --quiet --depth=1 origin "$LUA_REF"
          echo "commit=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

  record:
    name: ${{ matrix.image }}
    needs: [unit, lua]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images || '["ubuntu-26.04","ubuntu-24.04"]') }}
    env:
      IMAGE: ${{ matrix.image }}
      LUA_REF: ${{ needs.lua.outputs.commit }}
      ZCR_SCALE: ${{ inputs.scale }}
      ZCR_SCALE_LUA_MAX: ${{ inputs.scale_lua_max }}
      ZCR_SCALE_FULL_MAX: ${{ inputs.scale_full_max }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # While the names of the image's package mirrors do not resolve,
      # use a mirror outside ubuntu.com (tests/lib/apt-fallback.sh).
      - name: Package mirrors
        run: bash tests/lib/apt-fallback.sh
      - name: The adapter's programs
        run: |
          case $LUA_REF in
            *[!0-9a-f]*|'') echo "::error::not a commit id: $LUA_REF"; exit 64 ;;
          esac
          git fetch --quiet --depth=1 origin "$LUA_REF"
          mkdir -p lua
          for f in members tagged; do
            git show "FETCH_HEAD:crates/skyzfs-agent/src/zfs/cli/$f.lua" > "lua/$f.lua"
          done
          # The snapshot program only where the adapter still has it: the
          # take is `zfs snapshot -r` alone since M2.6c-2b, and the
          # recorder then leaves out the records that run the program.
          s=crates/skyzfs-agent/src/zfs/cli/snapshot.lua
          if git cat-file -e "FETCH_HEAD:$s" 2> /dev/null; then
            git show "FETCH_HEAD:$s" > lua/snapshot.lua
          else
            echo "No snapshot.lua at $LUA_REF: the snapshot program's records are not made." >> "$GITHUB_STEP_SUMMARY"
          fi
          # As the recorder's has_full: the full mode is #153's.
          if ! grep -q '"full"' lua/members.lua; then
            echo "members.lua at $LUA_REF has no full mode: the members-full records are not made." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record
        run: |
          case $ZCR_SCALE in
            *[!0-9\ ]*) echo "::error::scale is counts separated by spaces: $ZCR_SCALE"; exit 64 ;;
          esac
          read -ra counts <<< "$ZCR_SCALE"
          [ "${#counts[@]}" -le 3 ] || { echo "::error::scale: at most three counts"; exit 64; }
          for n in "${counts[@]}"; do
            case $n in 0*) echo "::error::scale: not a count: $n"; exit 64 ;; esac
            if [ "${#n}" -gt 6 ] || [ "$n" -gt 100000 ]; then echo "::error::scale: $n is more than 100000"; exit 64; fi
          done
          case $ZCR_SCALE_LUA_MAX in
            *[!0-9]*|0?*) echo "::error::scale_lua_max is a count: $ZCR_SCALE_LUA_MAX"; exit 64 ;;
          esac
          if [ "${#ZCR_SCALE_LUA_MAX}" -gt 6 ]; then echo "::error::scale_lua_max: at most 999999"; exit 64; fi
          case $ZCR_SCALE_FULL_MAX in
            *[!0-9]*|0?*) echo "::error::scale_full_max is a count: $ZCR_SCALE_FULL_MAX"; exit 64 ;;
          esac
          if [ "${#ZCR_SCALE_FULL_MAX}" -gt 6 ]; then echo "::error::scale_full_max: at most 999999"; exit 64; fi
          sudo --preserve-env=LUA_REF,ZCR_SCALE,ZCR_SCALE_LUA_MAX,ZCR_SCALE_FULL_MAX tests/kernel/zfs-cli-record.sh "$PWD/zfs-cli" "$PWD/lua"
      - name: Tarball and summary
        if: always()
        run: |
          sudo chmod -R a+rX zfs-cli 2>/dev/null || true
          # The agent's fixture (#147's recorded/<image>.json), from these
          # records, in the tarball beside them.
          sudo chown -R "$(id -u)" zfs-cli 2>/dev/null || true
          python3 -I tests/kernel/zfs_cli_json.py zfs-cli \
            "testing's recorder tests/kernel/zfs-cli-record.sh (skyzfs/skyzfs ${GITHUB_SHA::7}), run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, artifact zfs-cli-$IMAGE; Lua at ${LUA_REF::7}" \
            > "recorded-$IMAGE.json" && mv "recorded-$IMAGE.json" zfs-cli/ || echo "::warning::no fixture: zfs_cli_json.py failed"
          tar -czf "zfs-cli-$IMAGE.tar.gz" zfs-cli 2>/dev/null || true
          {
            echo "## ZFS command outputs, $IMAGE"
            echo
            sed 's/^/    /' zfs-cli/about.txt 2>/dev/null
            [ -e zfs-cli/setup-failed.txt ] && echo "**Setup failed:** $(cat zfs-cli/setup-failed.txt)"
            echo
            echo "| record | rc | note |"
            echo "|---|---|---|"
            cut -f1-3 zfs-cli/index.tsv 2>/dev/null | sed 's/|/\//g; s/\t/ | /g; s/^/| /; s/$/ |/'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zfs-cli-${{ matrix.image }}
          path: zfs-cli-${{ matrix.image }}.tar.gz
          retention-days: 90
