name: skyzfs-dio-split

# A diagnostic for #58's daemon-rig failure (run 43430825700): does a
# direct write of the suite's tool reach the server as two requests?
# tests/kernel/dio-split-rig.sh has the logic. It judges nothing: read
# the summary. By dispatch on a testing branch; a push of this file runs
# the probe alone once, on ubuntu-26.04.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "runner image"
        default: ubuntu-26.04
      daemons:
        description: "daemons to build, LABEL=COMMIT (40 hex digits) with a space between; the first serves the probe"
        default: "m1.3y=13592598d89415294e022f407b9aaa225b3ead66 topology=9f4d83d377731f14686c12ec69f1bc1eb3847efb"
      rounds:
        description: "passes of check c's suite for each daemon, in turn on one machine; 0 for the probe only"
        default: "0"
      probe_rounds:
        description: "pairs of writes in each mode of the probe"
        default: "2000"
  push:
    branches: ['skyzfs-testing*']
    paths:
      - .github/workflows/skyzfs-dio-split.yml

permissions:
  contents: read

jobs:
  split:
    name: ${{ inputs.image || 'ubuntu-26.04' }}
    runs-on: ${{ inputs.image || 'ubuntu-26.04' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Package mirrors
        run: bash tests/lib/apt-fallback.sh
      - name: Build
        env:
          DAEMONS: ${{ inputs.daemons || 'm1.3y=13592598d89415294e022f407b9aaa225b3ead66 topology=9f4d83d377731f14686c12ec69f1bc1eb3847efb' }}
          ROUNDS: ${{ inputs.rounds || '0' }}
          PROBE_ROUNDS: ${{ inputs.probe_rounds || '2000' }}
        run: |
          for v in "$ROUNDS" "$PROBE_ROUNDS"; do
            [[ $v =~ ^[0-9]+$ ]] || { echo "::error::not a number: '$v'"; exit 64; }
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev libclang-dev
          cargo build --release --locked -p skyzfs-blkcheck
          list=""
          for d in $DAEMONS; do
            label=${d%%=*}; ref=${d#*=}
            [[ $label =~ ^[a-z0-9.-]+$ && $ref =~ ^[0-9a-f]{40}$ ]] || { echo "::error::a daemon is LABEL=COMMIT: '$d'"; exit 64; }
            git fetch --no-tags --depth=1 origin "$ref"
            git worktree add --detach "$RUNNER_TEMP/src-$label" "$ref"
            # One target directory: the second build reuses what the
            # first built of the dependencies.
            (cd "$RUNNER_TEMP/src-$label" && CARGO_TARGET_DIR=$RUNNER_TEMP/target cargo build --release --locked -p skyzfsd --features test-hooks)
            cp "$RUNNER_TEMP/target/release/skyzfsd" "$RUNNER_TEMP/skyzfsd-$label"
            list+="$label=$RUNNER_TEMP/skyzfsd-$label "
            echo "- $label: skyzfsd built from \`$ref\` with its test hooks" >> "$GITHUB_STEP_SUMMARY"
            # The probe alone needs one daemon.
            [ "$ROUNDS" != 0 ] || break
          done
          {
            printf 'export RIG_BLKCHECK=%q\n' "$PWD/target/release/skyzfs-blkcheck"
            printf 'export RIG_DAEMONS=%q\n' "${list% }"
            printf 'export RIG_ROUNDS=%q\n' "$ROUNDS"
            printf 'export RIG_PROBE_ROUNDS=%q\n' "$PROBE_ROUNDS"
          } > "$RUNNER_TEMP/rig.env"
      - name: Rig
        run: |
          rc=0
          sudo bash -c '. "$1" && exec tests/kernel/dio-split-rig.sh "$2"' rig "$RUNNER_TEMP/rig.env" "$PWD/split-out" || rc=$?
          sudo chmod -R a+rX split-out 2>/dev/null || true
          cat split-out/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit $rc
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dio-split-${{ inputs.image || 'ubuntu-26.04' }}
          path: split-out/
          retention-days: 30
