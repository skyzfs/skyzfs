name: topology-bench

# Manual, RECORD-ONLY read-cache topology benchmark (no skynbd in the
# loop): nocache / dm-cache writethrough (the shipped §7.1 stack) /
# two-volume split (WAL thin without an origin, on a cold origin, and
# hydrated from its origin) / bcache writearound / Open CAS
# write-invalidate, each under postgres pgbench on a dm-thin volume
# with a read-only external origin; plus the ZFS exploration (zfs,
# zfs-plain, zfs-l2arc, zfs-slog, zfs-slog-l2arc, zfs-slog-rcache): one pool on a
# no-read-before-write device over
# a delayed image of the same database, the stand-in for ZFS on a
# userspace block backend; and, by request only, zfs-ublk (the pool on
# a ublk device served by the reference server) with its control
# zfs-loop, and zfs-skyzfsd (the pool on a device served by the
# project's daemon, built here in release without its test hooks).
# All the logic is `tests/bench/topology-bench.sh`,
# which is meant to be run by hand on a workstation with a real NVMe —
# the runner's loop-on-virtual-disk I/O is throttled and noisy, so the
# numbers here establish shapes and ratios, not absolutes.
#
# One job per topology: the stacks load out-of-tree and rarely-used
# kernel modules on a cloud kernel, and a runner VM that dies takes its
# step log with it — isolation names the culprit and keeps the other
# topologies' numbers. A fan-in job renders the combined table.
on:
  # workflow_dispatch is only offered once the file lives on the default
  # branch; until then a push that touches the benchmark itself (on any
  # other branch) runs it with the script's defaults. The SkyZFS working
  # branches are left out: the file is on main, so they dispatch what
  # they need, and a push there used to start thirteen runner jobs.
  push:
    branches-ignore: [main, zfs-topology, "skyzfs-*"]
    paths:
      - tests/bench/topology-bench.sh
      - tests/lib/gnu-dd.sh
      - .github/workflows/topology-bench.yml
  workflow_dispatch:
    inputs:
      runner:
        # The runner image is the variable that broke Tier B in Nov 2026
        # (ubuntu-latest moved to 26.04: Rust coreutils dd, sudo-rs), so
        # a dispatch can pin it to check one image against the other.
        # Scheduled, push and pull_request runs take ubuntu-latest.
        description: "Runner image"
        type: choice
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-latest
      topologies:
        description: "space-separated subset of: nocache baseline twovol twovol-origin twovol-hydrated bcache opencas zfs zfs-plain zfs-l2arc zfs-slog zfs-slog-l2arc zfs-slog-rcache zfs-loop zfs-ublk zfs-skyzfsd"
        default: "nocache baseline twovol twovol-origin twovol-hydrated bcache opencas zfs zfs-plain zfs-l2arc zfs-slog zfs-slog-l2arc zfs-slog-rcache"
      workloads:
        description: "space-separated subset of: tpcb select update"
        default: "tpcb select"
      scale:
        description: "pgbench scale (~15 MiB per unit)"
        default: "100"
      duration:
        description: "measured seconds per run"
        default: "120"
      warmup:
        description: "unmeasured warm-up seconds per run"
        default: "30"
      clients:
        description: "pgbench clients"
        default: "8"
      cache_pct:
        description: "cache device size, % of the loaded database"
        default: "25"
      cache_block_kb:
        description: "dm-cache block size (min 32, multiple of 32); Open CAS line size follows it, capped at 64"
        default: "32"
      shared_buffers:
        description: "postgres shared_buffers"
        default: "256MB"
      mem_limit:
        description: "cgroup v2 memory.max for postgres (empty = none); keep it below the database size so reads reach the block layer"
        default: "1G"
      origin_delay_ms:
        description: "dm-delay read latency on the origin, ms (the S3-backed NBD attach; the design plans on a 10 ms object-store round trip); 0 = local-file origin"
        default: "10"
      snap_modes:
        description: "snapshots DURING the window, one phase per mode on the same stack, in this order: none | suspend (thin: suspend, create_snap, resume) | sync (syncfs, then suspend) | freeze (suspend inside an fsfreeze). ZFS stacks run `zfs snapshot` for any mode but none"
        default: "none"
      snap_interval:
        description: "seconds between snapshots"
        default: "60"
      snap_keep:
        description: "snapshots retained; older ones are deleted"
        default: "2"
      zfs_recordsize:
        description: "recordsize of the PGDATA dataset in the ZFS topologies (above 8k a page write is a partial-record write)"
        default: "8k"
      zfs_params:
        description: "zfs module parameters for the ZFS topologies, name=value separated by spaces (e.g. l2arc_noprefetch=0 l2arc_headroom=0)"
        default: ""
      sequence:
        description: "Run several configurations one after another on ONE runner, so they share a machine: entries separated by ';', each 'label|TB_VAR=value TB_VAR=value' (values without spaces). Each entry needs its own TB_TOPOLOGIES. A daemon row is judged against the mean of the zfs-slog rows just before and after it, so begin and end with one and put one at least every third row. Replaces the per-topology matrix when set"
        default: ""
      cas_mode:
        description: "Open CAS mode: wi (write-invalidate, the true write-around) | wa | wt"
        default: "wi"
      opencas_ref:
        description: "Open CAS Linux git ref to build (only when topologies include opencas)"
        default: "v26.03.4"
      ublksrv_ref:
        description: "ublk-org/ublksrv git ref to build (only when topologies include zfs-ublk). The default is v1.9, the commit the kernel probe built and served a pool with on both runner images"
        default: "6d0d922614ec18e6f2b5d476af8d540a1d9c1de8"

env:
  # Inputs are empty on a push event; fall back to the dispatch defaults.
  TB_TOPOLOGIES: ${{ inputs.topologies || 'nocache baseline twovol twovol-origin twovol-hydrated bcache opencas zfs zfs-plain zfs-l2arc zfs-slog zfs-slog-l2arc zfs-slog-rcache' }}
  TB_WORKLOADS: ${{ inputs.workloads || 'tpcb select' }}
  TB_SCALE: ${{ inputs.scale || '100' }}
  TB_DURATION: ${{ inputs.duration || '120' }}
  TB_WARMUP: ${{ inputs.warmup || '30' }}
  TB_CLIENTS: ${{ inputs.clients || '8' }}
  TB_CACHE_PCT: ${{ inputs.cache_pct || '25' }}
  TB_CACHE_BLOCK_KB: ${{ inputs.cache_block_kb || '32' }}
  TB_SHARED_BUFFERS: ${{ inputs.shared_buffers || '256MB' }}
  TB_MEM_LIMIT: ${{ inputs.mem_limit || '1G' }}
  TB_ORIGIN_DELAY_MS: ${{ inputs.origin_delay_ms || '10' }}
  TB_SNAP_MODES: ${{ inputs.snap_modes || 'none' }}
  TB_SNAP_INTERVAL: ${{ inputs.snap_interval || '60' }}
  TB_SNAP_KEEP: ${{ inputs.snap_keep || '2' }}
  TB_ZFS_RECORDSIZE: ${{ inputs.zfs_recordsize || '8k' }}
  TB_ZFS_PARAMS: ${{ inputs.zfs_params || '' }}
  TB_SEQUENCE: ${{ inputs.sequence || '' }}
  TB_CAS_MODE: ${{ inputs.cas_mode || 'wi' }}
  OPENCAS_REF: ${{ inputs.opencas_ref || 'v26.03.4' }}
  UBLKSRV_REF: ${{ inputs.ublksrv_ref || '6d0d922614ec18e6f2b5d476af8d540a1d9c1de8' }}

jobs:
  plan:
    name: plan matrix
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      topologies: ${{ steps.m.outputs.topologies }}
    steps:
      - id: m
        run: |
          # A sequence is one job: its whole point is one machine.
          if [ -n "$TB_SEQUENCE" ]; then
            echo 'topologies=["sequence"]' >> "$GITHUB_OUTPUT"
          else
            echo "topologies=$(echo "$TB_TOPOLOGIES" | tr -s ' ' '\n' | sed '/^$/d' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  bench:
    name: ${{ matrix.topology }}
    needs: plan
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        topology: ${{ fromJSON(needs.plan.outputs.topologies) }}
    env:
      TB_WORK: /mnt/topology-bench
      TB_OUT: ${{ github.workspace }}/topology-bench-out
    steps:
      - uses: actions/checkout@v6
      # While the names of the image's package mirrors do not resolve,
      # use a mirror outside ubuntu.com (tests/lib/apt-fallback.sh).
      - name: Package mirrors
        run: bash tests/lib/apt-fallback.sh

      - name: Reclaim runner disk
        # One 72 GB root disk with ~14 GB free; the images need room.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dmsetup bcache-tools postgresql postgresql-contrib python3 e2fsprogs
          # bcache and dm-delay ship in the extra modules package on
          # cloud kernels; harmless when already present.
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          sudo systemctl stop postgresql 2>/dev/null || true
          for m in dm_thin_pool dm_cache dm_cache_smq dm_delay dm_snapshot bcache; do
            sudo modprobe "$m" || echo "::warning::modprobe $m failed"
          done
          sudo mkdir -p "$TB_WORK"
          uname -r; df -h "$TB_WORK"; free -m

      - name: Install ZFS
        if: startsWith(matrix.topology, 'zfs') || contains(inputs.sequence, 'zfs')
        run: |
          sudo apt-get install -y --no-install-recommends zfsutils-linux
          # Ubuntu kernels ship zfs.ko prebuilt; fall back to DKMS on a
          # kernel flavour that does not.
          sudo modprobe zfs || {
            sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)" zfs-dkms
            sudo modprobe zfs
          }
          sudo zfs version

      - name: Build the ublk reference server
        if: matrix.topology == 'zfs-ublk' || contains(inputs.sequence, 'zfs-ublk')
        run: |
          [[ $UBLKSRV_REF =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]] || { echo "::error::bad ublksrv ref"; exit 64; }
          sudo tests/kernel/build-ublksrv.sh "$UBLKSRV_REF"
          sudo modprobe ublk_drv
          sudo ublk features || true

      - name: System call tracing tools
        # Only for an entry with TB_SYSCALLS=1 or TB_PERF_RECORD=1. perf
        # for the running kernel where Ubuntu has it, strace in any case:
        # the trace uses perf when `perf trace` works and strace
        # otherwise; a recording needs perf.
        if: contains(inputs.sequence, 'TB_SYSCALLS=1') || contains(inputs.sequence, 'TB_PERF_RECORD=1')
        run: |
          sudo apt-get install -y --no-install-recommends strace
          sudo apt-get install -y --no-install-recommends linux-tools-common "linux-tools-$(uname -r)" \
            || echo "::notice::no perf package for $(uname -r): the trace uses strace"
          if sudo perf trace -s -- true > /dev/null 2>&1; then echo "perf trace works"; else echo "::notice::perf trace does not work here: the trace uses strace"; fi
          if sudo perf record -g -o /tmp/perf-probe.data -- true > /dev/null 2>&1; then echo "perf record works"; else echo "::notice::perf record does not work here: no recording"; fi

      - name: Build skyzfsd
        # A release build WITHOUT the test hooks: the binary one would
        # deploy, not the rigs'. The workspace's system packages, and
        # libclang for the binding to the ublk library.
        if: matrix.topology == 'zfs-skyzfsd' || contains(inputs.sequence, 'zfs-skyzfsd')
        run: |
          sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev libclang-dev
          cargo build --release --locked -p skyzfsd
          echo "TB_SKYZFSD=$PWD/target/release/skyzfsd" >> "$GITHUB_ENV"
          echo "TB_SKYZFSD_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD
          # A sequence entry may name another build with
          # TB_SKYZFSD_REF=<commit, short commit or branch>: each one
          # named is built here, from its own worktree, into a binary of
          # its own, so that one machine runs them all.
          # An entry with an empty ref would run the branch's own build
          # under a row that says otherwise: refused before anything runs.
          if grep -qE 'TB_(SKYZFSD|SKZ_TIME)_REF=($|[ ;])' <<< "$TB_SEQUENCE"; then
            echo "::error::the sequence names an empty TB_SKYZFSD_REF= or TB_SKZ_TIME_REF="; exit 64
          fi
          refs=$(grep -oE 'TB_SKYZFSD_REF=[A-Za-z0-9_.,:=+-]+' <<< "$TB_SEQUENCE" | cut -d= -f2- | sort -u || true)
          # TB_SKZ_TIME_REF=<ref> in any entry, for the whole job: the
          # daemon's times are read with that ref's
          # tests/bench/skz_time.py (a daemon newer than this branch has
          # keys this branch's copy does not know). Its copy goes into
          # the results, for the combined table.
          skzref=$(grep -oE 'TB_SKZ_TIME_REF=[A-Za-z0-9_.,:=+-]+' <<< "$TB_SEQUENCE" | head -n 1 | cut -d= -f2- || true)
          if [ -n "$refs$skzref" ]; then
            git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*'
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --no-tags --quiet origin; fi
          fi
          for ref in $refs; do
            sha=$(git rev-parse --verify --quiet "origin/$ref^{commit}" || git rev-parse --verify --quiet "$ref^{commit}") \
              || { echo "::error::sequence names TB_SKYZFSD_REF=$ref, which is no branch or commit here"; exit 64; }
            git worktree add --detach "$RUNNER_TEMP/wt-$ref" "$sha"
            (cd "$RUNNER_TEMP/wt-$ref" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-refs" cargo build --release --locked -p skyzfsd)
            cp "$RUNNER_TEMP/target-refs/release/skyzfsd" "$RUNNER_TEMP/skyzfsd-$ref"
            echo "| $ref | $sha |" >> "$RUNNER_TEMP/refs.md"
          done
          if [ -n "$skzref" ]; then
            sha=$(git rev-parse --verify --quiet "origin/$skzref^{commit}" || git rev-parse --verify --quiet "$skzref^{commit}") \
              || { echo "::error::sequence names TB_SKZ_TIME_REF=$skzref, which is no branch or commit here"; exit 64; }
            mkdir -p "$TB_OUT/skz-time"
            git show "$sha:tests/bench/skz_time.py" > "$TB_OUT/skz-time/skz_time.py"
            echo "TB_SKZ_TIME_DIR=$TB_OUT/skz-time" >> "$GITHUB_ENV"
            echo "| skz_time.py (TB_SKZ_TIME_REF=$skzref) | $sha |" >> "$RUNNER_TEMP/refs.md"
          fi
          if [ -s "$RUNNER_TEMP/refs.md" ]; then
            { echo '| sequence names TB_SKYZFSD_REF= | built from |'; echo '|---|---|'; cat "$RUNNER_TEMP/refs.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          sudo modprobe ublk_drv

      - name: Build Open CAS (casadm with write-invalidate enabled)
        if: matrix.topology == 'opencas' || contains(inputs.sequence, 'opencas')
        run: |
          sudo apt-get install -y --no-install-recommends \
            git make gcc "linux-headers-$(uname -r)" libelf-dev python3-setuptools
          git clone --depth 1 --branch "$OPENCAS_REF" --recurse-submodules \
            https://github.com/Open-CAS/open-cas-linux /tmp/open-cas-linux
          cd /tmp/open-cas-linux
          ./configure
          # CAS_EXT_EXP=1 compiles casadm's `wi` cache-mode entry
          # (casadm/Makefile gates it behind WI_AVAILABLE); the kernel
          # module accepts the mode unconditionally.
          make -j"$(nproc)" CAS_EXT_EXP=1
          sudo make install CAS_EXT_EXP=1
          sudo modprobe cas_cache
          casadm --version

      - name: Disk sync of the work disk
        # One observation of the disk the daemon's files sit on, at the
        # start of the job: 64 MiB written through the page cache and
        # its fdatasync timed, then the same with O_DIRECT. Some runners
        # take a sync of 8 MiB in about 40 ms and others in about 4; the
        # summary sets this line beside the rows of this machine.
        run: |
          mkdir -p "$TB_OUT"
          sudo python3 -I tests/bench/disk-sync.py "$TB_WORK/disk-sync" 64 | tee "$TB_OUT/disk-sync.txt"
          { echo '```'; cat "$TB_OUT/disk-sync.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run benchmark
        # ubuntu-26.04's sudo-rs does not carry the job's environment
        # through `sudo -E`: the script ran on its own defaults, with no
        # memory cap and its results outside the upload path, and said
        # nothing. Hand the TB_* settings over in a file the root shell
        # sources instead.
        run: |
          export TB_TOPOLOGIES="${{ matrix.topology }}"
          export -p | grep -E '^declare -x (TB_[A-Z0-9_]+|PATH)=' > "$RUNNER_TEMP/tb.env"
          cat "$RUNNER_TEMP/tb.env"
          if [ -z "$TB_SEQUENCE" ]; then
            sudo bash -c '. "$1" && exec tests/bench/topology-bench.sh' tb "$RUNNER_TEMP/tb.env"
            exit
          fi
          # One machine, several configurations. Each entry is a label
          # and TB_* assignments; they are passed to env as arguments,
          # never evaluated, and each entry gets its own output
          # directory so equal topology names do not collide.
          IFS=';' read -ra entries <<< "$TB_SEQUENCE"
          i=0
          for e in "${entries[@]}"; do
            i=$((i + 1))
            label=${e%%|*}; assigns=${e#*|}
            [[ $label =~ ^[A-Za-z0-9\ ._=,+-]*$ ]] || { echo "::error::bad sequence label: $label"; exit 64; }
            args=()
            for a in $assigns; do
              [[ $a =~ ^TB_[A-Z0-9_]+=[A-Za-z0-9_.,:=+-]*$ ]] || { echo "::error::bad sequence assignment: $a"; exit 64; }
              args+=("$a")
              # The build the step "Build skyzfsd" made for this ref.
              if [[ $a == TB_SKYZFSD_REF=* ]]; then args+=("TB_SKYZFSD=$RUNNER_TEMP/skyzfsd-${a#TB_SKYZFSD_REF=}"); fi
            done
            echo "::group::sequence $i: $label ($assigns)"
            sudo bash -c '. "$1" && shift && exec env "$@" tests/bench/topology-bench.sh' tb "$RUNNER_TEMP/tb.env" \
              "TB_LABEL=$label" "TB_OUT=$TB_OUT/$i" TB_REUSE_ORIGIN=1 "${args[@]}"
            echo "::endgroup::"
          done

      - name: Evidence on failure
        if: failure()
        run: |
          sudo dmsetup ls --tree || true
          sudo losetup -a || true
          ls /sys/block | grep -E 'bcache|cas' || true
          sudo zpool status -v 2>/dev/null || true
          sudo ublk list 2>/dev/null || true
          sudo zfs list -t all 2>/dev/null || true
          sudo tail -40 /proc/spl/kstat/zfs/dbgmsg 2>/dev/null || true
          sudo tail -50 "$TB_WORK/pg.log" 2>/dev/null || true
          # The interesting kernel lines are the ones BEFORE a trace.
          sudo dmesg | grep -iE 'device-mapper|dm-[0-9]|loop[0-9]|ublk|bcache|cas_|OCF|EXT4|ZFS|SPL|zio|WARN|BUG|Call Trace|error' | tail -120 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: topology-bench-${{ matrix.topology }}
          path: topology-bench-out/
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: combined table
    needs: bench
    if: always()
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: topology-bench-*
          path: all
      - name: Render
        run: |
          find all -name '*.json' | sort
          # The skz_time.py the bench job read the daemon's times with,
          # when the sequence named one (TB_SKZ_TIME_REF).
          f=$(find all -path '*/skz-time/skz_time.py' | head -n 1)
          if [ -n "$f" ]; then export TB_SKZ_TIME_DIR="$PWD/${f%/skz_time.py}"; echo "skz_time.py from $f"; fi
          tests/bench/topology-bench.sh summarize all | tee summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: topology-bench-summary
          path: summary.md
          retention-days: 90
