name: images

# Container images for the CSI rollout (auth design §9, item 6b):
# pushed to ghcr.io on main and version tags (linux/amd64 + linux/arm64 —
# the Rust build cross-compiles on the amd64 build host, so QEMU only
# runs the small runtime apt layers). PRs build amd64 only, loaded into
# the local docker daemon as a smoke of the full image build.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - "bins/skynbd-csi-driver/**"
  workflow_dispatch:
    inputs:
      keep-n-untagged:
        description: "Untagged images to keep per package during cleanup"
        type: number
        default: 10
      keep-n-tagged:
        description: "Tagged images to keep per package during cleanup (main and v* are always kept)"
        type: number
        default: 10

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [csi-driver, skynbdd]
        include:
          - target: csi-driver
            image: skynbd-csi-driver
          - target: skynbdd
            image: skynbdd
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # PRs: build-only, loaded locally (an unloaded, unpushed build
          # would leave the result in cache with a "no output" warning).
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One shared scope, one writer, main-only writes — the GHA
          # cache is a 10 GiB LRU pool, and the previous per-target
          # scopes stored the identical multi-GB build stage twice per
          # run (plus a PR-scoped copy per PR build), so entries evicted
          # each other before the next run could read them and every PR
          # re-ran the dependency cook. The csi-driver job's graph is a
          # superset (the build stage compiles both binaries), so its
          # export alone covers the skynbdd job and the k3s smokes; the
          # skynbdd job only loses its trivial runtime apt layer.
          cache-from: type=gha,scope=images
          cache-to: ${{ github.event_name != 'pull_request' && matrix.target == 'csi-driver' && 'type=gha,mode=max,scope=images' || '' }}

      # Every push adds a permanent sha-<commit> tag (plus, per tagged
      # image, four child versions: the two per-arch manifests and their
      # provenance attestations), so the package grows without bound.
      # Nothing here ever becomes a true orphan — when main advances, the
      # old digest is still held by its sha-* tag — so pruning untagged
      # versions alone reclaims nothing; the tagged sha-*/branch images
      # have to age out too.
      #
      # main is what the chart's default image tag points at and v* are
      # the releases, so both are excluded from the count and never
      # deleted. Must be a multi-arch-aware cleaner: those four child
      # versions are themselves "untagged", and a naive version pruner
      # (actions/delete-package-versions) would delete them out from
      # under the tags that reference them.
      - name: Cleanup old images
        if: github.event_name != 'pull_request'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ matrix.image }}
          # inputs is only populated on workflow_dispatch; push/tag runs
          # fall back to the defaults.
          keep-n-untagged: ${{ inputs.keep-n-untagged || 10 }}
          keep-n-tagged: ${{ inputs.keep-n-tagged || 10 }}
          exclude-tags: "main,v*"
          token: ${{ secrets.GITHUB_TOKEN }}
