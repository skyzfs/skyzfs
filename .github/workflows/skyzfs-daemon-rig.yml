name: skyzfs-daemon-rig

# The kernel rig for skyzfsd (design §4.1 and §4.2, M1): what the kernel
# and ZFS do with a ublk device served through the daemon's command
# line. Parameters; kill -9 under load; a second serve; an orderly
# stop; the conformance suite of skyzfs-blk through the block device; a
# failed volume; one request held for minutes; a disk that fails under
# the in-place store's home image (check g, M1.T23). The job fails unless
# every pin and every control is as the table `EXPECTED` in
# `tests/kernel/daemon_check.py` has it. All the logic is
# `tests/kernel/daemon-rig.sh`.
#
# Which server is behind the device (the job `plan` decides, and its
# summary says):
#   - a pull request: the daemon. A pull request that changes the rig
#     (`tests/kernel/`, `tests/lib/` or this file) also runs the stand-in on the
#     reference ublk server (`tests/kernel/skyzfsd-ref.sh`): the
#     stand-in is what shows that the rig still catches what it caught,
#     the controls among it, and the daemon run tries the rig's lines
#     that only the daemon can carry. One that changes nothing but the
#     rig's files therefore runs both.
#   - by dispatch: the input `server` (daemon, stand-in or both).
#   - a push that changes this file on a testing branch: the stand-in.
# Which store the daemon serves from (`--store`, always named): on a
# pull request the in-place store, the one that changes; by dispatch the
# input `store`, in-place unless it says log. The log store's code is
# frozen until it is removed (M1.T20), and with the in-place store the
# pins that rest on the log are NA (`NOT_FOR_IN_PLACE` in the judge).
# The summary says for every pin what it rests on.
#
# Check g's negative control (M1.T23): the input `daemon_ref` builds the
# daemon from another commit under this checkout's rig. With
# cd0e76360b4a3e8597c8ac5d68182b9e05c077e3 (before #46: no cache drop at
# a start), `checks: g`, the job must fail with three lines that differ:
# pin_start_serves_what_the_disk_holds, pin_failed_start_fails_volume and
# pin_failed_start_suspends_pool (run 43397129438). That is how to show
# again that check g catches what it is for.
on:
  workflow_dispatch:
    inputs:
      images:
        description: "runner images, a JSON list: amd64 ubuntu-26.04 ubuntu-24.04, arm64 ubuntu-26.04-arm ubuntu-24.04-arm"
        default: '["ubuntu-26.04","ubuntu-24.04","ubuntu-26.04-arm"]'
      checks:
        description: "which checks: a parameters, b kill under load, c the conformance suite, d a failed volume, e a held request, g a disk that fails under the in-place store (daemon only); f (never by default) the courses after a refused start, daemon only, about 25 minutes"
        default: "a b c d e g"
      f_courses:
        description: "check f only: which courses, of scrub export reopen clear writers zed zedreopen long longnolog (long and longnolog: check b's 300 s courses until M1.T8). One course per run gives it a clean machine"
        default: "scrub export reopen clear writers zed zedreopen long longnolog"
      kills:
        description: "kill -9 of the server under load, how many times"
        default: "20"
      hold_s:
        description: "seconds one request is held"
        default: "300"
      server:
        description: "what serves the device: daemon (skyzfsd built with its test hooks), stand-in (the reference ublk server), or both"
        type: choice
        options: [daemon, stand-in, both]
        default: daemon
      daemon_ref:
        description: "build the daemon from this commit (40 hex digits) and not from the checkout, with the rig of the checkout: a negative control, e.g. a build without a rule a check pins. Empty: the checkout"
        default: ""
      store:
        description: "the daemon's store: in-place, or log (frozen until it is removed; its checkpoint pins are taken only with it)"
        type: choice
        options: [in-place, log]
        default: in-place
  # A workflow that has never run cannot be dispatched from a branch.
  # A push that changes this file runs it once on the testing branch.
  push:
    branches: ['skyzfs-testing*']
    paths:
      - .github/workflows/skyzfs-daemon-rig.yml
  pull_request:
    paths:
      - tests/kernel/**
      - bins/skyzfs-blkcheck/**
      - crates/skyzfs-blk/**
      - crates/skyzfs-ublk/**
      - crates/skyzfs-ublk-sys/**
      - crates/skyzfs-local/**
      - bins/skyzfsd/**
      # What decides the daemon's binary beside its sources, and what
      # the rig sources from outside tests/kernel/ (lim.sh, net-try.sh,
      # gnu-dd.sh, apt-fallback.sh).
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - tests/lib/**
      - .github/workflows/skyzfs-daemon-rig.yml

# A newer push to a pull request supersedes the run of the older one; a
# dispatched run is left alone.
concurrency:
  group: daemon-rig-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The job runs branch code and third-party code as root: its token can
# read the repository and nothing else.
permissions:
  contents: read

jobs:
  unit:
    name: the table and its judge (no kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tests/kernel/test_daemon_check.py -v
      - run: bash tests/kernel/test_klog.sh
      - run: bash tests/kernel/test_devnode.sh
      - run: bash tests/kernel/test_looks.sh
      - run: bash tests/kernel/test_ublksrvd_look.sh

  # Which servers this run drives; see the head of this file.
  plan:
    name: which server
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.plan.outputs.servers }}
      exclude: ${{ steps.plan.outputs.exclude }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ inputs.server }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case $EVENT in
            workflow_dispatch)
              case $SERVER in
                daemon) servers='["daemon"]'; why="by dispatch: the daemon" ;;
                stand-in) servers='["stand-in"]'; why="by dispatch: the stand-in" ;;
                both) servers='["daemon","stand-in"]'; why="by dispatch: both" ;;
                *) echo "::error::server is daemon, stand-in or both: '$SERVER'"; exit 64 ;;
              esac ;;
            pull_request)
              # The files the pull request changes against its base. If
              # they cannot be told, both servers run.
              if changed=$(git diff --name-only "$BASE...HEAD"); then
                if printf '%s\n' "$changed" | grep -q -E '^(tests/kernel/|tests/lib/|\.github/workflows/skyzfs-daemon-rig\.yml$)'; then
                  servers='["daemon","stand-in"]'; why="a pull request that changes the rig: the daemon and the stand-in"
                else
                  servers='["daemon"]'; why="a pull request that does not change the rig: the daemon"
                fi
              else
                servers='["daemon","stand-in"]'; why="the pull request's changed files could not be told: both"
              fi ;;
            *) servers='["stand-in"]'; why="a push: the stand-in" ;;
          esac
          echo "servers=$servers" >> "$GITHUB_OUTPUT"
          echo "Server behind the device: $why." | tee -a "$GITHUB_STEP_SUMMARY"
          # The stand-in on arm64 by dispatch only: it shows that the rig
          # still catches what it caught, which the amd64 jobs show on
          # every change of the rig.
          if [ "$EVENT" = workflow_dispatch ]; then
            exclude='[]'
          else
            exclude='[{"image":"ubuntu-26.04-arm","server":"stand-in"},{"image":"ubuntu-24.04-arm","server":"stand-in"}]'
            echo "The stand-in on arm64 runs by dispatch only." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"

  rig:
    name: ${{ matrix.image }}, ${{ matrix.server }}
    needs: plan
    runs-on: ${{ matrix.image }}
    timeout-minutes: 90
    # arm64 (M1.T21): a pull request also runs the daemon on ubuntu-26.04-arm,
    # where the package fallback works; the stand-in on arm64, and
    # ubuntu-24.04-arm (no mirror list, so no fallback in an outage), by
    # dispatch (input images). 4 KiB pages only.
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images || '["ubuntu-26.04","ubuntu-24.04","ubuntu-26.04-arm"]') }}
        server: ${{ fromJSON(needs.plan.outputs.servers) }}
        exclude: ${{ fromJSON(needs.plan.outputs.exclude) }}
    steps:
      - uses: actions/checkout@v6
      # While the names of the image's package mirrors do not resolve,
      # use a mirror outside ubuntu.com (tests/lib/apt-fallback.sh).
      - name: Package mirrors
        run: bash tests/lib/apt-fallback.sh
      - name: Rig
        # The settings go in a file: ubuntu-26.04's sudo-rs does not
        # carry the environment through.
        env:
          CHECKS: ${{ inputs.checks || 'a b c d e g' }}
          DAEMON_REF: ${{ inputs.daemon_ref || '' }}
          F_COURSES: ${{ inputs.f_courses || 'scrub export reopen clear writers zed zedreopen long longnolog' }}
          KILLS: ${{ inputs.kills || '20' }}
          HOLD_S: ${{ inputs.hold_s || '300' }}
          SERVER: ${{ matrix.server }}
          STORE: ${{ github.event_name == 'workflow_dispatch' && inputs.store || 'in-place' }}
        run: |
          case $STORE in in-place|log) ;; *) echo "::error::store is in-place or log: '$STORE'"; exit 64 ;; esac
          [ "$SERVER" != daemon ] || echo "The daemon's store: \`--store $STORE\`." >> "$GITHUB_STEP_SUMMARY"
          # Single letters with one space between: "abcde" or a lone
          # space would run nothing.
          [[ $CHECKS =~ ^[abcdefg](\ [abcdefg])*$ ]] || { echo "::error::checks are letters of a b c d e f g with a space between: '$CHECKS'"; exit 64; }
          for v in "$KILLS" "$HOLD_S"; do
            [[ $v =~ ^[0-9]+$ ]] || { echo "::error::not a number: $v"; exit 64; }
          done
          # Check c drives the block device with the suite's own tool.
          if [[ $CHECKS == *c* ]]; then
            cargo build --release --locked -p skyzfs-blkcheck
          fi
          case $SERVER in
            daemon)
              # The workspace's system packages, and libclang for the
              # binding's library.
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev libclang-dev
              daemon_bin=$PWD/target/release/skyzfsd
              if [ -n "$DAEMON_REF" ]; then
                # A negative control: another build of the daemon under
                # the rig of this checkout.
                [[ $DAEMON_REF =~ ^[0-9a-f]{40}$ ]] || { echo "::error::daemon_ref is a commit's 40 hex digits: '$DAEMON_REF'"; exit 64; }
                git fetch --no-tags --depth=1 origin "$DAEMON_REF"
                git worktree add --detach "$RUNNER_TEMP/daemon-src" "$DAEMON_REF"
                (cd "$RUNNER_TEMP/daemon-src" && cargo build --release --locked -p skyzfsd --features test-hooks)
                daemon_bin=$RUNNER_TEMP/daemon-src/target/release/skyzfsd
                echo "The daemon was built from \`$DAEMON_REF\`, not from this checkout: a negative control, whose lines may differ from the table on purpose." >> "$GITHUB_STEP_SUMMARY"
              else
                cargo build --release --locked -p skyzfsd --features test-hooks
              fi ;;
            stand-in) ;;
            *) echo "::error::server is daemon or stand-in: '$SERVER'"; exit 64 ;;
          esac
          {
            printf 'export RIG_BLKCHECK=%q\n' "$PWD/target/release/skyzfs-blkcheck"
            printf 'export RIG_CHECKS=%q\n' "$CHECKS"
            printf 'export RIG_F_COURSES=%q\n' "$F_COURSES"
            echo "export RIG_KILLS=$KILLS RIG_HOLD_S=$HOLD_S"
            # On the daemon, with its own defaults: no --unsafe-allow-*
            # override until a run shows that one is needed.
            if [ "$SERVER" = daemon ]; then
              printf 'export RIG_SKYZFSD=%q\n' "$daemon_bin"
              printf 'export RIG_STORE=%q\n' "$STORE"
              [ -z "$DAEMON_REF" ] || printf 'export RIG_DAEMON_REF=%q\n' "built from $DAEMON_REF (input daemon_ref), not the checkout"
            fi
          } > "$RUNNER_TEMP/rig.env"
          echo "CHECKS=$CHECKS" >> "$GITHUB_ENV"
          sudo bash -c '. "$1" && exec tests/kernel/daemon-rig.sh "$2" /mnt/skz-daemon-rig' \
            rig "$RUNNER_TEMP/rig.env" "$PWD/rig-out"
      - name: Judge against the table
        if: always()
        run: |
          sudo chmod -R a+rX rig-out 2>/dev/null || true
          rc=0
          python3 tests/kernel/daemon_check.py rig-out --checks "${CHECKS:-a b c d e g}" > summary.md || rc=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          # rig-out is root's (the rig runs under sudo): the judge's table
          # goes into the artifact with sudo, or it is silently left out.
          sudo cp summary.md rig-out/ || echo "::warning::the judge's table could not be put into the artifact"
          case $rc in
            0) ;;
            1) echo "::error title=daemon rig::results differ from the table EXPECTED"; exit 1 ;;
            *) echo "::error title=daemon rig::the rig itself failed; this is not a verdict on the server"; exit 2 ;;
          esac
      - uses: actions/upload-artifact@v6
        id: upload
        if: always()
        continue-on-error: true
        with:
          name: daemon-rig-${{ matrix.image }}-${{ matrix.server }}
          path: rig-out/
          retention-days: 90
      # GitHub's artifact service failed for ten minutes at a time on
      # 2026-11-11 and the results of four jobs were lost. One more try,
      # and this one decides the step's colour.
      - name: Upload again if the first upload failed
        uses: actions/upload-artifact@v6
        if: always() && steps.upload.outcome == 'failure'
        with:
          name: daemon-rig-${{ matrix.image }}-${{ matrix.server }}
          path: rig-out/
          retention-days: 90
          overwrite: true
