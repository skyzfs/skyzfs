name: skyzfs-daemon-rig

# The kernel rig for skyzfsd (design §4.1 and §4.2, M1): what the kernel
# and ZFS do with a ublk device served through the daemon's command
# line. Parameters; kill -9 under load; a second serve; an orderly
# stop; a failed volume; one request held for minutes. Until the daemon
# exists the server is a stand-in on the reference ublk server
# (`tests/kernel/skyzfsd-ref.sh`); the summary says for every pin what
# it rests on. The job fails unless every pin and every control is as
# the table `EXPECTED` in `tests/kernel/daemon_check.py` has it.
# All the logic is `tests/kernel/daemon-rig.sh`.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: "which checks: a parameters, b kill under load, d a failed volume, e a held request"
        default: "a b d e"
      kills:
        description: "kill -9 of the server under load, how many times"
        default: "20"
      hold_s:
        description: "seconds one request is held"
        default: "300"
  pull_request:
    paths:
      - tests/kernel/**
      - crates/skyzfs-ublk/**
      - bins/skyzfsd/**
      - .github/workflows/skyzfs-daemon-rig.yml

# A newer push to a pull request supersedes the run of the older one; a
# dispatched run is left alone.
concurrency:
  group: daemon-rig-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The job runs branch code and third-party code as root: its token can
# read the repository and nothing else.
permissions:
  contents: read

jobs:
  unit:
    name: the table and its judge (no kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tests/kernel/test_daemon_check.py -v

  rig:
    name: ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-26.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      - name: Rig
        # The settings go in a file: ubuntu-26.04's sudo-rs does not
        # carry the environment through.
        env:
          CHECKS: ${{ inputs.checks || 'a b d e' }}
          KILLS: ${{ inputs.kills || '20' }}
          HOLD_S: ${{ inputs.hold_s || '300' }}
        run: |
          [[ $CHECKS =~ ^[abde\ ]+$ ]] || { echo "::error::checks are letters of a b d e: $CHECKS"; exit 64; }
          for v in "$KILLS" "$HOLD_S"; do
            [[ $v =~ ^[0-9]+$ ]] || { echo "::error::not a number: $v"; exit 64; }
          done
          {
            printf 'export RIG_CHECKS=%q\n' "$CHECKS"
            echo "export RIG_KILLS=$KILLS RIG_HOLD_S=$HOLD_S"
            # To run the rig on the daemon: build it here and add
            #   printf 'export RIG_SKYZFSD=%q\n' "$PWD/target/release/skyzfsd"
          } > "$RUNNER_TEMP/rig.env"
          echo "CHECKS=$CHECKS" >> "$GITHUB_ENV"
          sudo bash -c '. "$1" && exec tests/kernel/daemon-rig.sh "$2" /mnt/skz-daemon-rig' \
            rig "$RUNNER_TEMP/rig.env" "$PWD/rig-out"
      - name: Judge against the table
        if: always()
        run: |
          sudo chmod -R a+rX rig-out 2>/dev/null || true
          rc=0
          python3 tests/kernel/daemon_check.py rig-out --checks "${CHECKS:-a b d e}" > summary.md || rc=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cp summary.md rig-out/ 2>/dev/null || true
          case $rc in
            0) ;;
            1) echo "::error title=daemon rig::results differ from the table EXPECTED"; exit 1 ;;
            *) echo "::error title=daemon rig::the rig itself failed; this is not a verdict on the server"; exit 2 ;;
          esac
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: daemon-rig-${{ matrix.image }}
          path: rig-out/
          retention-days: 90
