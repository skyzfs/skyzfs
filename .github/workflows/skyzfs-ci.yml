name: skyzfs-ci

# CI for the SkyZFS working branches. `ci.yml` runs on `main` and on pull
# requests only, and the sessions that work on SkyZFS push to
# `zfs-topology` and to `skyzfs-*` branches without opening pull
# requests, so nothing covered those pushes. Same checks and the same
# setup as the `lint` and `test` jobs of `ci.yml`.
on:
  push:
    branches:
      - zfs-topology
      - "skyzfs-*"
  workflow_dispatch:

# A newer push to a branch replaces the run of the older one.
concurrency:
  group: skyzfs-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No DWARF, as in ci.yml: with debuginfo the workspace's test binaries
  # exceed the runner's free disk and the link dies with SIGBUS.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: git ls-files '*.sh' | xargs -r shellcheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: dm build headers (skynbd-agent "dm" feature)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev
      # Its own cache, shared by every working branch. The `dev` cache
      # belongs to ci.yml's test job on main; a cache written on one
      # branch is not readable from another, so reusing that key here
      # would buy nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skyzfs-lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: dm build headers (skynbd-agent "dm" feature)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skyzfs-test
      - run: cargo test --workspace
