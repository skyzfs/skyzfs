name: skyzfs-ci

# CI for pushes to the SkyZFS working branches that no pull request
# covers. `ci.yml` runs on `main` and on every pull request. That leaves
# two kinds of push with no checks: a merge into `zfs-topology`, and a
# push to a `skyzfs-*` branch whose work package has no pull request
# open yet. This workflow runs for those, with the same checks and the
# same setup as the `lint` and `test` jobs of `ci.yml`. Once a branch
# has an open pull request, `ci.yml` runs on each push to it and this
# workflow steps aside (the `gate` job), so nothing runs twice.
on:
  push:
    branches:
      - zfs-topology
      - "skyzfs-*"
  workflow_dispatch:

# A newer push to a branch replaces the run of the older one.
concurrency:
  group: skyzfs-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No DWARF, as in ci.yml: with debuginfo the workspace's test binaries
  # exceed the runner's free disk and the link dies with SIGBUS.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Is this push already covered by ci.yml? It is when the branch is the
  # head of an open pull request. If the question cannot be answered,
  # run: twice is better than not at all.
  gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=0
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" --jq length) || open=0
          fi
          if [ "$open" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME has an open pull request: ci.yml covers this push." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: git ls-files '*.sh' | xargs -r shellcheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: dm build headers (skynbd-agent "dm" feature)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev
      # Its own cache, shared by every working branch. The `dev` cache
      # belongs to ci.yml's test job on main; a cache written on one
      # branch is not readable from another, so reusing that key here
      # would buy nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skyzfs-lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: dm build headers (skynbd-agent "dm" feature)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdevmapper-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skyzfs-test
      - run: cargo test --workspace
