[package]
name = "skyzfs-blkcheck"
description = "Runs the skyzfs-blk conformance suite against a Linux block device, for the kernel rig (design §4.1)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
skyzfs-blk = { workspace = true, features = ["conformance"] }

[target.'cfg(target_os = "linux")'.dependencies]
# For the value of O_DIRECT only: no call into libc, no unsafe.
libc = "0.2"
# fallocate on a block device is how Linux offers discard and
# write-zeroes without an ioctl, and so without unsafe. The signal to a
# server is sent from here too, without a process started for it.
rustix = { version = "1", features = ["fs", "process"] }
