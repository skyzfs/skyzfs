[package]
name = "skynbdctl"
description = "SkyNBD operator CLI: fsck + rebuild-refs (design §6.5, §12)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
s3 = ["skynbd-store/s3"]

[dependencies]
skynbd-types = { workspace = true }
skynbd-engine = { workspace = true }
skynbd-store = { workspace = true }
skynbd-refs = { workspace = true }
skynbd-api = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true }
serde_json = "1"
toml = "0.8"
ulid = { workspace = true }
blake3 = { workspace = true }
