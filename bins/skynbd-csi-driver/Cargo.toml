[package]
name = "skynbd-csi-driver"
description = "CSI plugin: SkyNBD volumes as Kubernetes PVs over forced-TLS NBD (auth design §9)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
skynbd-agent = { path = "../../crates/skynbd-agent", features = ["dm"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "process",
    "fs",
    "io-util",
] }
tokio-stream = { version = "0.1", features = ["net"] }
async-trait = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
axum = "0.8"
tempfile = { workspace = true }
skynbd-agent = { path = "../../crates/skynbd-agent", features = ["dm", "testutil"] }
