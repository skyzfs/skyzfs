[package]
name = "skyzfsd"
description = "The SkyZFS daemon: serves one volume of the local store as a ublk device (design §4.2)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# Options that inject faults, for the kernel rig. Not in a default build:
# without it the daemon refuses them as a usage error.
# The request log (`serve --request-log`) reads CLOCK_MONOTONIC.
# `serve --refuse-one-fetch` sends one first fetch with no buffer, through
# the binding's own fetches (`refuse-fetch`).
# The request log hashes each block a write covers whole (`sha2`).
# `serve --kill-at-upload` wraps the uploader's objects (`async-trait`,
# `bytes`) and kills the daemon (`rustix/process`).
test-hooks = [
    "skyzfs-local/test-hooks",
    "rustix/time",
    "rustix/process",
    "skyzfs-ublk-sys/refuse-fetch",
    "dep:sha2",
    "dep:async-trait",
    "dep:bytes",
]

[dependencies]
skyzfs-blk = { workspace = true }
skyzfs-control = { workspace = true }
skyzfs-local = { workspace = true }
skyzfs-ublk = { workspace = true }
skyzfs-ublk-sys = { workspace = true }
skyzfs-uberblock = { workspace = true }
skyzfs-upload = { workspace = true }
# The volume in object storage (M2.4c): its objects, refs and lease. The
# s3 graph is in the workspace build already (skynbd-refs's tests enable
# it).
skynbd-engine = { workspace = true }
skynbd-types = { workspace = true }
skynbd-format = { workspace = true }
skynbd-refs = { workspace = true }
skynbd-store = { workspace = true, features = ["s3"] }
# A volume's id is the hash of its name (the `remote` file).
blake3 = { workspace = true }
ulid = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
thiserror = { workspace = true }
sha2 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

# statfs, for the rule that the daemon's files are on no ZFS pool; the
# channel's peer check (`SO_PEERCRED`, the effective user).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "net", "process"] }

[dev-dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }
