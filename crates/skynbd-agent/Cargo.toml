[package]
name = "skynbd-agent"
description = "Production V3.2 snapshot agent: durable state machine, recovery planner, freeze watchdog (agent design doc)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
skynbd-format = { workspace = true }
skynbd-types = { workspace = true }
skynbd-store = { workspace = true }
skynbd-refs = { workspace = true }
skynbd-engine = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "process"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# "dm" feature: raw dm-thin stack (DmStack) — needs libdevmapper-dev +
# libudev-dev headers at build time; runtime is pure ioctls (M10b).
devicemapper = { version = "0.34", optional = true }
thinp = { git = "https://github.com/jthornber/thin-provisioning-tools", tag = "v1.3.3", default-features = false, optional = true }
libc = { version = "0.2", optional = true }

[features]
dm = ["dep:devicemapper", "dep:thinp", "dep:libc"]
testutil = []

[dev-dependencies]
tempfile = "3"
skynbd-api = { path = "../skynbd-api" }
skynbd-nbd = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# test-util: the paused clock of the pipeline's timing test.
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
