[package]
name = "skyzfs-local"
description = "The SkyZFS local store: the write log, and the simulated disk it is tested on (design §5.1)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# For test rigs only: lets the owner of a served store fail its log on
# demand (`Served::fail_now`). Never on in a build that serves data.
test-hooks = []

[dependencies]
thiserror = { workspace = true }
crc32c = { workspace = true }
getrandom = { workspace = true }
skyzfs-blk = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# For the real-file tests of the in-place store: the call that counts a
# file's cached pages (`cachestat`), which this crate does not make.
skyzfs-ublk-sys = { workspace = true }
skyzfs-blk = { workspace = true, features = ["conformance"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# For the value of O_DIRECT only: no call into libc, no unsafe.
libc = "0.2"
# For `fallocate`, to deallocate a range of the home image; `fadvise`,
# to drop its cache; and the page size, by libc's `sysconf(_SC_PAGESIZE)`
# (`use-libc-auxv`) rather than a read of `/proc/self/auxv`.
rustix = { version = "1", features = ["fs", "param", "use-libc-auxv"] }
