[package]
name = "skyzfs-local"
description = "The SkyZFS local store: the write log, and the simulated disk it is tested on (design §5.1)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# For test rigs only: lets the owner of a served store fail its log on
# demand (`Served::fail_now`). Never on in a build that serves data.
test-hooks = []

[dependencies]
thiserror = { workspace = true }
crc32c = { workspace = true }
getrandom = { workspace = true }
skyzfs-blk = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
skyzfs-blk = { workspace = true, features = ["conformance"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# For the value of O_DIRECT only: no call into libc, no unsafe.
libc = "0.2"
