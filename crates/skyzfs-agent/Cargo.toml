[package]
name = "skyzfs-agent"
description = "The SkyZFS node agent: snapshots a pool on a served volume and has the daemon publish them (design §5.2, §5.4; M2.6)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# Kills a timed-out command's process group (`host`).
rustix = { version = "1", features = ["process"] }
skyzfs-control = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The ring's size, for the bound on the syncs after a rewind import
# (`engine::SYNC_PAST_MAX`); the agent links nothing of the daemon.
skyzfs-uberblock = { workspace = true }
tempfile = { workspace = true }
