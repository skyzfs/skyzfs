description = "The SkyZFS ublk transport: ublk requests translated to the block target contract and pumped between a queue and a target (design §4.2)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
skyzfs-blk = { workspace = true }
