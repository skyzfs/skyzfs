[package]
name = "skyzfs-upload"
description = "The SkyZFS uploader: a held cut into object storage, and the check of what is there (design §5.2, §5.3; M2.4)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
skyzfs-blk = { workspace = true }
skyzfs-local = { workspace = true }
skynbd-engine = { workspace = true }
skynbd-format = { workspace = true }
skynbd-refs = { workspace = true }
skynbd-store = { workspace = true }
skynbd-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
skyzfs-uberblock = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
ulid = { workspace = true }
